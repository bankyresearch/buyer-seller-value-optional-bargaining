   </g>
   <g id="text_6">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #183341" transform="translate(328.055899 137.57043)">193 products × 80 draws</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #183341" transform="translate(306.115149 150.04043)">Private values stay in the evaluator</text>
   </g>
   <g id="text_7">
