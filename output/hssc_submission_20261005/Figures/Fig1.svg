   </g>
   <g id="text_2">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #183341" x="255.11811" y="56.109055" transform="rotate(-0 255.11811 56.109055)">Declared data splits; separate simulator training; frozen policy selection</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #183341" x="133.885984" y="119.358947" transform="rotate(-0 133.885984 119.358947)">Four frozen seller policies</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #183341" transform="translate(70.512047 137.57043)">Full-state FQI / Clock-only FQI</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #183341" transform="translate(69.869062 150.380399)">FQI is trained in the simulator</text>
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; fill: #183341" transform="translate(56.782281 162.51043)">Time concession / Buyer responsive</text>
   </g>
   <g id="text_5">
